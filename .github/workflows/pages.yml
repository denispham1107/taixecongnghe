name: Deploy Phố Việt WebGL
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml', 'AgentScripts/PublishWebArtifact.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore exact Unity data from verified Git-sized parts
        run: python3 AgentScripts/PublishWebArtifact.py materialize --source docs --output _site
      - name: Validate the built game
        run: |
          test -s _site/index.html
          test -s _site/build-info.json
          test -s _site/manifest.webmanifest
          test -s _site/precache.json
          test -s _site/sw.js
          test -n "$(find _site/Build -name '*.wasm*' -print -quit)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
