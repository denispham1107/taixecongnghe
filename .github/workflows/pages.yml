# 21.356: game chuyển sang Firebase Hosting (https://gotaviet.web.app/, `firebase deploy` từ Builds/WebGL).
# GitHub Pages chỉ còn trang chuyển hướng trong docs/ (index.html, 404.html, sw.js tự gỡ) — không build/đóng gói game ở đây nữa.
name: Redirect GitHub Pages to gotaviet.web.app
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate redirect page
        run: |
          test -s docs/index.html
          grep -q 'gotaviet.web.app' docs/index.html
          test -s docs/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
