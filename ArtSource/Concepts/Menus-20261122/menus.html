<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mẫu menu Phố Việt</title>
<style>
@font-face{font-family:BVP;src:url(font/BeVietnamPro-SemiBold.ttf);font-weight:100 900}
:root{--navy:#12233a;--navy2:#0b1726;--cream:#fcf2cf;--gold:#f5c542;--teal:#33e0c8;--teal2:#16a596;--red:#ea4436;--red2:#b8261c;
--blue:#4aa3ff;--purple:#a45cff;--orange:#f39a3b;--green:#4fcf7a;--glass:rgba(14,40,46,.80)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a141d;color:#e8eef3;font-family:BVP,system-ui,sans-serif}
.page{max-width:1500px;margin:0 auto;padding:28px 20px 60px}
.page h1{font-size:30px;font-weight:600;color:var(--cream)}
.page .lead{color:#9fb3c2;margin:6px 0 30px;font-size:15px;line-height:1.5}
.sec{margin:0 0 56px}
.sec h2{font-size:26px;color:var(--cream);display:flex;gap:12px;align-items:center}
.sec h2 b{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--navy)}
.sec p{color:#9fb3c2;margin:6px 0 18px;line-height:1.5;font-size:15px;max-width:1000px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:18px}
.cell .cap{font-size:13px;color:#8aa0b1;margin:8px 2px 0}
.fw{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000}
.fw>.fr{position:absolute;left:0;top:0;transform-origin:0 0}
body.only{background:#000}
body.only .fw{border-radius:0}

/* ---------- khung chung ---------- */
.fr{position:relative;width:1947px;height:900px;overflow:hidden;background-size:cover;background-position:center;font-family:BVP;color:var(--cream);font-weight:600;line-height:1.15}
.fr.pc{width:1440px}
.abs{position:absolute}
.dim{position:absolute;inset:0;background:rgba(4,16,22,.62);z-index:5}
.dim~*{z-index:6}
.row{display:flex;align-items:center}
.ico{display:inline-block;flex:none}
.stk{text-shadow:-3px -3px 0 var(--navy),3px -3px 0 var(--navy),-3px 3px 0 var(--navy),3px 3px 0 var(--navy),0 -3px 0 var(--navy),0 3px 0 var(--navy),-3px 0 0 var(--navy),3px 0 0 var(--navy),0 6px 0 var(--navy)}
.stk2{text-shadow:-2px -2px 0 var(--navy),2px -2px 0 var(--navy),-2px 2px 0 var(--navy),2px 2px 0 var(--navy),0 4px 0 var(--navy)}
.caps{letter-spacing:.08em;text-transform:uppercase}

/* nút arcade (giống bộ nút B Arcade) */
.arc{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;border:5px solid var(--navy);border-radius:28px;color:var(--cream);
 box-shadow:inset 0 0 0 5px var(--rim,var(--red)),inset 0 0 0 7px rgba(255,255,255,.45),0 7px 0 var(--navy2),0 16px 26px rgba(0,0,0,.35);
 background:var(--fill,linear-gradient(180deg,#ff7466,#e23d30 52%,#b9251b))}
.arc::after{content:"";position:absolute;left:12px;right:12px;top:10px;height:38%;border-radius:20px 20px 40px 40px/20px 20px 14px 14px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.arc.slate{--fill:linear-gradient(180deg,#5d7086,#3b4c60 55%,#2f3e50)}
.arc.teal{--rim:var(--teal);--fill:linear-gradient(180deg,#3ee7cf,#14a594 55%,#0d7d72)}
.arc.blue{--rim:var(--blue);--fill:linear-gradient(180deg,#6cb6ff,#2f7fe0 55%,#215fb3)}
.arc.gold{--rim:var(--gold);--fill:linear-gradient(180deg,#ffd666,#f0aa1e 55%,#c9850c)}
.keycap{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 12px;border-radius:11px;background:var(--cream);color:var(--navy);border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy);font-size:20px;text-shadow:none}

/* ================= MẪU A — KÍNH HUD ================= */
.A .glass{position:absolute;background:var(--glass);border:2px solid rgba(252,242,207,.20);border-radius:30px;box-shadow:0 22px 50px rgba(0,8,16,.42)}
.A .glass::before{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%);pointer-events:none}
.A .lab{font-size:19px;color:var(--gold);letter-spacing:.09em}
.A .sub{color:rgba(252,242,207,.72);font-size:25px;line-height:1.35}
.A .hudbtn{width:66px;height:66px;border-radius:50%;background:rgba(255,241,207,.9);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(252,242,207,.25)}
.A .sep{height:2px;background:rgba(252,242,207,.16);border-radius:2px}
.A .pill{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;background:rgba(252,242,207,.12);font-size:19px}
.A .ghost{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:24px;border:2px solid rgba(252,242,207,.35);background:rgba(252,242,207,.08);color:var(--cream);font-size:24px}

/* ================= MẪU B — ARCADE DÀY ================= */
.B .card{position:absolute;border:7px solid var(--navy);border-radius:42px;
 background:linear-gradient(180deg,#647890 0%,#41546a 42%,#33445a 72%,var(--tint,#3b3346) 100%);
 box-shadow:inset 0 0 0 9px var(--rim,var(--gold)),inset 0 0 0 12px rgba(252,242,207,.55),0 12px 0 var(--navy2),0 30px 60px rgba(0,0,0,.45)}
.B .card::before{content:"";position:absolute;left:16px;right:16px;top:16px;height:34%;border-radius:28px 28px 60px 60px/28px 28px 18px 18px;background:linear-gradient(rgba(255,255,255,.17),rgba(255,255,255,0));pointer-events:none}
.B .tag{position:absolute;left:50%;transform:translateX(-50%);top:-30px;height:58px;padding:0 34px;border:5px solid var(--navy);border-radius:29px;display:flex;align-items:center;gap:12px;font-size:24px;letter-spacing:.06em;white-space:nowrap;
 background:var(--tagc,var(--red));box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 5px 0 var(--navy2)}
.B .inset{position:absolute;background:rgba(9,20,32,.55);border:4px solid var(--navy);border-radius:24px;box-shadow:inset 0 4px 0 rgba(0,0,0,.25)}
.B .chip{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 20px;border:4px solid var(--navy);border-radius:25px;background:#2c3b4d;box-shadow:inset 0 0 0 3px var(--c,var(--gold)),0 4px 0 var(--navy2);font-size:22px}
.B .sub{font-size:25px;color:rgba(252,242,207,.85);line-height:1.35}

/* ================= MẪU C — TEM ĐUA ================= */
.C .sk{transform:skewX(-11deg)}
.C .pan{position:absolute;background:linear-gradient(100deg,rgba(10,22,34,.94),rgba(14,32,46,.88));border-left:12px solid var(--red);box-shadow:16px 16px 0 rgba(0,0,0,.28)}
.C .band{position:absolute;display:flex;align-items:center;padding:0 26px}
.C .chk{background:repeating-conic-gradient(var(--cream) 0 25%,var(--navy) 0 50%) 0 0/24px 24px}
.C .haz{background:repeating-linear-gradient(-45deg,var(--gold) 0 26px,var(--navy) 26px 52px)}
.C .cbtn{position:absolute;display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;letter-spacing:.06em;color:var(--cream);background:linear-gradient(180deg,#ff5a4a,#d42e22);box-shadow:10px 10px 0 var(--navy2)}
.C .cbtn.alt{background:rgba(252,242,207,.1);border:3px solid rgba(252,242,207,.55);box-shadow:none;font-size:24px}
.C .cbtn.s{gap:12px;box-shadow:8px 8px 0 var(--navy2)}
.keycap.sm{min-width:36px;height:36px;padding:0 9px;border-radius:9px;font-size:16px;box-shadow:0 3px 0 var(--navy)}
.C .cbtn.teal{background:linear-gradient(180deg,#3ee7cf,#11a091);color:var(--navy)}
.C .lab{font-size:20px;letter-spacing:.14em;color:var(--gold)}
.C .speed{position:absolute;height:6px;border-radius:3px;background:rgba(252,242,207,.5)}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
/* ---------------- icon (nét navy dày kiểu B Arcade) ---------------- */
const N='#12233a';
const I={
gear:(s=40,c='#33e0c8')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M24 4l4 5 6-2 1 6 6 2-2 6 5 4-5 4 2 6-6 2-1 6-6-2-4 5-4-5-6 2-1-6-6-2 2-6-5-4 5-4-2-6 6-2 1-6 6 2z" fill="${c}" stroke="${N}" stroke-width="3" stroke-linejoin="round"/><circle cx=24 cy=24 r=7 fill="#fcf2cf" stroke="${N}" stroke-width="3"/></svg>`,
pin:(s=30,c='#f5c542')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M24 44s-14-15-14-25a14 14 0 0 1 28 0c0 10-14 25-14 25z" fill="${c}" stroke="${N}" stroke-width="3.5" stroke-linejoin="round"/><circle cx=24 cy=19 r=5.5 fill="${N}"/></svg>`,
trophy:(s=30,c='#f5c542')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M14 6h20v12a10 10 0 0 1-20 0z" fill="${c}" stroke="${N}" stroke-width="3.5" stroke-linejoin="round"/><path d="M14 10H6c0 8 4 11 9 11M34 10h8c0 8-4 11-9 11" fill="none" stroke="${N}" stroke-width="3.5"/><path d="M20 28h8v7h-8zM14 36h20v6H14z" fill="${c}" stroke="${N}" stroke-width="3.5" stroke-linejoin="round"/></svg>`,
play:(s=34,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M14 8l26 16-26 16z" fill="${c}" stroke="${N}" stroke-width="4" stroke-linejoin="round"/></svg>`,
pause:(s=34,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><rect x=10 y=8 width=10 height=32 rx=3 fill="${c}" stroke="${N}" stroke-width="3.5"/><rect x=28 y=8 width=10 height=32 rx=3 fill="${c}" stroke="${N}" stroke-width="3.5"/></svg>`,
home:(s=30,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M6 23L24 7l18 16h-5v18H29V30h-10v11H11V23z" fill="${c}" stroke="${N}" stroke-width="3.5" stroke-linejoin="round"/></svg>`,
retry:(s=34,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-5-10.7" fill="none" stroke="${N}" stroke-width="10" stroke-linecap="round"/><path d="M38 24a14 14 0 1 1-5-10.7" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><path d="M27 6l11 3-4 11z" fill="${c}" stroke="${N}" stroke-width="3" stroke-linejoin="round"/></svg>`,
check:(s=28,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M9 25l10 10 20-22" fill="none" stroke="${N}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 25l10 10 20-22" fill="none" stroke="${c}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
close:(s=28,c='#fcf2cf')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M12 12l24 24M36 12L12 36" stroke="${N}" stroke-width="11" stroke-linecap="round"/><path d="M12 12l24 24M36 12L12 36" stroke="${c}" stroke-width="5.5" stroke-linecap="round"/></svg>`,
speaker:(s=34,c=N)=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M8 18h8l10-8v28l-10-8H8z" fill="${c}"/><path d="M32 17c3 4 3 10 0 14M37 12c6 7 6 17 0 24" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`,
siren:(s=34)=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M10 38V26a14 14 0 0 1 28 0v12z" fill="#ea4436" stroke="${N}" stroke-width="3.5"/><path d="M24 12V26" stroke="${N}" stroke-width="3"/><path d="M24 26V12a14 14 0 0 1 14 14v12H24z" fill="#4aa3ff" stroke="${N}" stroke-width="3.5"/><rect x=6 y=37 width=36 height=6 rx=2 fill="#fcf2cf" stroke="${N}" stroke-width="3"/></svg>`,
boom:(s=54)=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M24 3l5 10 10-5-3 11 10 4-10 5 5 10-11-3-6 10-4-11-11 4 4-10L3 24l10-5-4-10 10 4z" fill="#f39a3b" stroke="${N}" stroke-width="3" stroke-linejoin="round"/><path d="M24 14l3 6 6-1-3 6 5 4-7 1-2 6-3-6-6 2 3-6-5-4 7-1z" fill="#f5c542"/></svg>`,
star:(s=26,c='#f5c542')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M24 4l5.9 13.2 14.1 1.4-10.6 9.5 3.1 14L24 35l-12.5 7.1 3.1-14L4 18.6l14.1-1.4z" fill="${c}"/></svg>`,
bars:(lv,c='#f5c542',s=44)=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48">${[0,1,2,3].map(i=>`<rect x="${4+i*11}" y="${34-i*9}" width="8" height="${10+i*9}" rx="2" fill="${i<lv?c:'rgba(252,242,207,.18)'}"/>`).join('')}</svg>`,
chev:(s=40,c='#fcf2cf')=>`<svg class=ico width=${s*1.6} height=${s} viewBox="0 0 76 48"><g fill="${c}" stroke="${N}" stroke-width="3" stroke-linejoin="round"><path d="M4 8h12l14 16-14 16H4l14-16z"/><path d="M26 8h12l14 16-14 16H26l14-16z" opacity=".75"/><path d="M48 8h12l14 16-14 16H48l14-16z" opacity=".5"/></g></svg>`,
gauge:(lv,s=60,c='#f5c542')=>`<svg class=ico width=${s} height=${s} viewBox="0 0 48 48"><path d="M6 34a18 18 0 1 1 36 0" fill="none" stroke="${N}" stroke-width="9" stroke-linecap="round"/><path d="M6 34a18 18 0 1 1 36 0" fill="none" stroke="rgba(252,242,207,.25)" stroke-width="4" stroke-linecap="round"/><path d="M6 34a18 18 0 0 1 ${[0,4.2,18,31.8,36][lv]} ${[0,-14,-18,-14,0][lv]}" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/><circle cx=24 cy=34 r=4.5 fill="#fcf2cf" stroke="${N}" stroke-width="3"/><path d="M24 34L${24+16*Math.cos(Math.PI*(1-lv/4.6))} ${34-16*Math.sin(Math.PI*(1-lv/4.6))}" stroke="${N}" stroke-width="5" stroke-linecap="round"/><path d="M24 34L${24+16*Math.cos(Math.PI*(1-lv/4.6))} ${34-16*Math.sin(Math.PI*(1-lv/4.6))}" stroke="#fcf2cf" stroke-width="2" stroke-linecap="round"/></svg>`,
};
const flag=(s=52)=>`<div style="width:${s}px;height:${s}px;border-radius:${s*.26}px;background:#da251d;display:grid;place-items:center;border:3px solid ${N}">${I.star(s*.68)}</div>`;

/* ---------------- dữ liệu ---------------- */
const D={street:'Tôn Đức Thắng',best:'1.893 m',dist:'223 m',jail:'26 m',reason:'Trúng đạn xe tăng!',detail:'Đạn pháo nổ ngay cạnh xe.',left:'Còn 1.670 m nữa là chạm kỷ lục'};
const GFX=[
 {n:'Rất cao',d:'Độ phân giải gốc của màn hình · nét nhất. Đã tối ưu bộ nhớ để không văng game.',t:'2778 × 1284',lv:4,c:'#a45cff'},
 {n:'Cao',d:'Nét gần bằng Rất cao, nhẹ máy hơn một chút.',t:'2222 × 1027',lv:3,c:'#4aa3ff'},
 {n:'Trung bình',d:'Tự động điều chỉnh khi đang chơi theo tình trạng máy.',t:'TỰ ĐỘNG · 1389 × 642',lv:2,c:'#33e0c8'},
 {n:'Yếu',d:'Dành cho máy yếu · mượt nhất, tắt bóng đổ.',t:'926 × 428',lv:1,c:'#4fcf7a'}];
const SEL=2;
const BTN=['left','right','shield','reverse','gas','jump','missile','laser'];
const BTNLAB={left:'TRÁI',right:'PHẢI',shield:'KHIÊN',reverse:'LÙI',gas:'GA',jump:'NHẢY',missile:'TÊN LỬA',laser:'LAZER'};

/* ================= MẪU A ================= */
const A={
brand:(x,y)=>`<div class="glass row" style="left:${x}px;top:${y}px;height:84px;padding:0 26px 0 14px;gap:16px;border-radius:24px">${flag(54)}<div><div style="font-size:31px">PHỐ VIỆT</div><div class=lab style="font-size:14px;margin-top:2px">CHUYẾN XE KHÔNG NGỪNG</div></div></div>`,
place:(r,y)=>`<div class="glass" style="right:${r}px;top:${y}px;padding:16px 30px 16px 22px;border-radius:24px"><div class="row" style="gap:10px">${I.pin(26)}<span class=lab style="font-size:16px">ĐỊA ĐIỂM HÔM NAY</span></div><div style="font-size:30px;margin-top:6px;padding-left:36px">${D.street}</div></div>`,
welcome(pc){
 const W=pc?1440:1947,x=pc?56:96,cw=pc?600:640,top=pc?170:160;
 let h=`<div class="fr ${pc?'pc':''} A" style="background-image:url(img/${pc?'nang-pc':'nang'}.jpg)">`;
 h+=`<div class=abs style="left:0;top:0;bottom:0;width:${cw+260}px;background:linear-gradient(90deg,rgba(4,16,22,.55),rgba(4,16,22,0))"></div>`;
 h+=this.brand(x,36)+this.place(x,36);
 h+=`<div class=glass style="left:${x}px;top:${top}px;width:${cw}px;height:${pc?500:540}px;padding:36px 40px">
  <div class=row style="gap:12px"><span style="width:8px;height:24px;border-radius:3px;background:var(--red)"></span><span class=lab>BẢN ĐỒ MỞ · SÀI GÒN</span></div>
  <div class="abs hudbtn" style="right:30px;top:26px;background:rgba(252,242,207,.12);box-shadow:inset 0 0 0 2px rgba(252,242,207,.3)">${I.gear(40)}</div>
  <div style="font-size:${pc?74:82}px;line-height:1.02;margin-top:22px;letter-spacing:-.01em">LÁI QUA<br><span style="color:var(--gold)">PHỐ QUEN.</span></div>
  <div class=sub style="margin-top:18px">Né CSGT, khủng long, xe tăng<br>và trực thăng trên phố mở.</div>
  <div class="arc" style="position:absolute;left:40px;right:40px;bottom:${pc?92:100}px;height:${pc?88:100}px;font-size:${pc?32:36}px"><span class="stk" style="position:relative;z-index:1">LÊN XE THÔI</span><span style="position:relative;z-index:1">${I.chev(28)}</span></div>
  <div class="abs row" style="left:40px;right:40px;bottom:30px;gap:12px">${I.trophy(28)}<span class=lab style="font-size:17px">KỶ LỤC</span><span style="font-size:28px;margin-left:auto">${D.best}</span></div>
 </div>`;
 h+=this.hints(pc,x,W);
 return h+`</div>`;},
hints(pc,x,W){
 if(pc) return `<div class="glass row" style="left:${x}px;bottom:36px;height:76px;padding:0 26px;gap:26px;border-radius:22px;font-size:20px">
  <span class=row style="gap:8px"><span class=keycap>←</span><span class=keycap>→</span><span style="opacity:.6">/</span><span class=keycap>WASD</span> LÁI</span>
  <span class=row style="gap:8px"><span class=keycap>J</span> NHẢY</span><span class=row style="gap:8px"><span class=keycap>F</span> TÊN LỬA</span>
  <span class=row style="gap:8px"><span class=keycap>SPACE</span> PHANH TAY</span><span class=row style="gap:8px"><span class=keycap>P</span> TẠM DỪNG</span></div>`;
 return `<div class="glass row" style="left:${x}px;bottom:34px;height:104px;padding:0 24px;gap:22px;border-radius:24px;font-size:18px">
  <span class=lab style="font-size:16px;width:120px;line-height:1.2">ĐIỀU KHIỂN</span>
  ${BTN.map(b=>`<span style="display:flex;flex-direction:column;align-items:center;gap:2px"><img src="img/btn_${b}.png" width=60 height=60></span>`).join('')}
  <span class=sub style="font-size:20px;line-height:1.3;max-width:330px">Giữ TRÁI / PHẢI để lái · giữ GA, LÙI · chạm NHẢY, TÊN LỬA</span></div>`;},
gfx(){
 let h=this.welcome(false).replace(/<\/div>$/,'');
 h+=`<div class=dim style="background:rgba(3,12,18,.72)"></div>`;
 const w=1040,hh=850,x=(1947-w)/2,y=25;
 h+=`<div class=glass style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;padding:34px 40px;background:rgba(12,34,40,.92)">
  <div class=row style="gap:16px">${I.gear(46)}<span style="font-size:38px">CẤU HÌNH ĐỒ HỌA</span></div>
  <div class=sub style="font-size:22px;margin-top:8px;color:var(--gold)">Chọn mức hợp với máy của bạn · lưu cho lần chơi sau.</div>
  <div class="abs hudbtn" style="right:32px;top:28px;width:60px;height:60px;background:rgba(252,242,207,.12);box-shadow:inset 0 0 0 2px rgba(252,242,207,.3)">${I.close(26)}</div>
  ${GFX.map((g,i)=>{const s=i==SEL;return `<div class=row style="position:relative;margin-top:${i?12:22}px;height:112px;padding:0 26px;gap:22px;border-radius:22px;

 h+=`<div class="cbtn sk s" style="left:${x+24}px;top:${y+276}px;width:510px;height:84px;font-size:28px">${I.retry(32)} THỬ MỘT CHUYẾN NỮA</div>`;
 h+=`<div class="cbtn sk alt" style="left:${x+566}px;top:${y+276}px;width:290px;height:84px;font-size:20px">${I.home(25)} VỀ ĐẦU PHỐ</div>`;
 return h+`</div>`;},
jail(){
 let h=`<div class="fr C" style="background-image:url(img/jail.jpg)">`;
 const tape=(st,t1,t2)=>`<div class="haz abs" style="${st};height:52px;box-shadow:0 7px 0 rgba(0,0,0,.35)"><div style="position:absolute;inset:8px 0;background:var(--gold);display:flex;align-items:center;justify-content:space-around;color:var(--navy);font-size:21px;letter-spacing:.12em"><span>${t1}</span><span>${t2}</span></div></div>`;
 h+=tape('left:-100px;width:760px;top:44px;transform:rotate(-8deg)','CSGT · TẠM GIỮ','CSGT · TẠM GIỮ');
 h+=tape('left:-120px;width:840px;bottom:76px;transform:rotate(5deg)','KHÔNG PHẬN SỰ MIỄN VÀO','CSGT');
 const x=1300,y=190;
 h+=`<div class="abs sk" style="left:${x}px;top:${y}px;width:500px;height:390px;background:rgba(10,22,34,.94);border-left:11px solid var(--blue);box-shadow:13px 13px 0 rgba(0,0,0,.3);padding:28px 32px">
  <div class=row style="gap:10px">${I.siren(31)}<span class=lab style="color:#ff7b6e;font-size:16px">PHỐ VIỆT · TẠM GIỮ</span></div>
  <div style="font-size:74px;line-height:1;margin-top:13px">ĐÃ BỊ BẮT</div>
  <div style="font-size:21px;color:rgba(252,242,207,.8);margin-top:10px">CSGT đã đưa bạn vào phòng giam.</div>
  <div class=row style="gap:24px;margin-top:20px"><div><div class=lab style="font-size:13px">QUÃNG ĐƯỜNG</div><div style="font-size:42px;color:var(--gold)">${D.jail}</div></div><div style="width:3px;height:56px;background:rgba(252,242,207,.2)"></div><div><div class=lab style="font-size:13px">KỶ LỤC</div><div style="font-size:42px">${D.best}</div></div></div>
 </div>`;
 h+=`<div class="cbtn sk s" style="left:${x+24}px;top:${y+306}px;width:450px;height:82px;font-size:28px">${I.retry(32)} CHƠI LẠI</div>`;
 h+=`<div class="cbtn sk alt" style="left:${x+8}px;top:${y+416}px;width:450px;height:60px;font-size:20px;background:rgba(10,22,34,.9)">${I.home(23)} VỀ ĐẦU PHỐ</div>`;
 return h+`</div>`;},
pause(){
 let h=`<div class="fr C" style="background-image:url(img/hud.jpg)"><div class=dim style="background:rgba(4,12,18,.7)"></div>`;
 const x=600,y=250;
 h+=`<div class="abs sk" style="left:${x}px;top:${y}px;width:740px;height:350px;background:rgba(10,22,34,.95);border-left:11px solid var(--teal);box-shadow:13px 13px 0 rgba(0,0,0,.3);padding:32px 40px">
  <div class=row style="gap:20px"><div style="width:88px;height:88px;background:var(--teal);display:grid;place-items:center">${I.pause(48)}</div>
  <div><div class=lab style="font-size:16px">NGHỈ MỘT CHÚT</div><div style="font-size:54px;margin-top:4px">Dừng chân bên phố.</div></div></div>
  <div style="font-size:21px;color:rgba(252,242,207,.8);margin-top:20px">Phố vẫn đợi. Sẵn sàng thì mình đi tiếp nhé.</div>
  <div class=chk style="position:absolute;right:32px;top:28px;width:96px;height:11px;background-size:20px 20px"></div>
 </div>`;
 h+=`<div class="cbtn sk teal s" style="left:${x+32}px;top:${y+250}px;width:450px;height:84px;font-size:28px">${I.play(32,'#fcf2cf')} ĐI TIẾP</div>`;
 h+=`<div class="cbtn sk alt" style="left:${x+32}px;top:${y+364}px;width:320px;height:64px;font-size:20px;background:rgba(10,22,34,.9)">${I.home(23)} VỀ ĐẦU PHỐ</div>`;
 h+=`<div class="cbtn sk alt" style="left:${x+376}px;top:${y+364}px;width:74px;height:64px;background:rgba(10,22,34,.9)">${I.speaker(28,'#fcf2cf')}</div>`;
 h+=`<div class="cbtn sk alt" style="left:${x+474}px;top:${y+364}px;width:74px;height:64px;background:rgba(10,22,34,.9)">${I.gear(32)}</div>`;
 return h+`</div>`;}
};

/* ---------------- dựng trang ---------------- */
const STY={A,B,C,C2};
const SCR=[['welcome','Màn chào (điện thoại ngang)'],['gfx','Cấu hình đồ họa'],['over','Kết thúc chuyến xe'],['jail','Đã bị bắt'],['pause','Tạm dừng'],['pc','Màn chào trên máy tính (có phím tắt)']];
function render(s,k){const o=STY[s];return k=='pc'?o.welcome(true):k=='welcome'?o.welcome(false):o[k]();}
const INFO={
A:['Kính HUD','Cùng chất liệu với thanh HUD trên cùng: kính tối xanh lục lam, viền kem mảnh, nhãn vàng có biểu tượng, số to màu kem. Nút chính là nút arcade (viền navy + viền màu + bóng). Nhẹ nhàng, gọn, ít che cảnh nhất.'],
B:['Arcade dày','Mỗi thẻ được làm như một nút B Arcade phóng to: viền navy dày, viền màu theo từng màn (vàng = chào, đỏ = thua, xanh dương = tạm dừng/bị bắt, ngọc = đồ họa), nền xám-xanh bóng, chữ kem viền navy, nhãn dạng thẻ treo trên đầu. Vui, đậm chất game.'],
C2:['Tem đua — bản nhỏ hơn','Mẫu C người dùng đã chọn, thu nhỏ khoảng 20 % mọi khối, chữ và nút; giữ nguyên bố cục và màu.'],
C:['Tem đua','Phong cách đường đua: khối nghiêng, chữ nghiêng to, dải ca-rô, băng chéo đỏ «KẾT THÚC CHUYẾN XE», băng dây vàng-đen ở phòng giam. Động, mạnh, khác hẳn kiểu thẻ cũ.']};
const q=new URLSearchParams(location.search);
const page=document.getElementById('page');
if(q.get('only')){document.body.classList.add('only');const [s,k]=q.get('only').split('-');page.style.padding=0;page.style.maxWidth='none';page.innerHTML=render(s,k);}
else{
 let h=`<h1>Phố Việt — 3 kiểu menu mới</h1><div class=lead>Mỗi kiểu có đủ 5 màn trên điện thoại ngang (khung 1947 × 900 điểm của game = iPhone Pro Max) và màn chào trên máy tính (1440 × 900). Nền là ảnh chụp thật trong game.</div>`;
 for(const s of ['C2','A','B','C']){h+=`<div class=sec><h2><b>${s=='C2'?'C':s}</b>${INFO[s][0]}</h2><p>${INFO[s][1]}</p><div class=grid>`;
  for(const [k,c] of SCR){const pc=k=='pc';h+=`<div class=cell><div class=fw data-w="${pc?1440:1947}" style="aspect-ratio:${pc?1440:1947}/900">${render(s,k)}</div><div class=cap>${s} · ${c}</div></div>`;}
  h+=`</div></div>`;}
 page.innerHTML=h;
 const fit=()=>document.querySelectorAll('.fw').forEach(f=>{f.firstElementChild.style.transform=`scale(${f.clientWidth/+f.dataset.w})`});
 fit();addEventListener('resize',fit);
}
</script>
</body>
