<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 21.344 mẫu 2 «Đồng hồ tốc độ»: đồng hồ neon kim vọt vào vùng đỏ, tia sét giữa mặt đồng hồ, sao đỏ ở trục — cùng tông «Kính neon» của nút điều khiển -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#153a5a"/><stop offset=".6" stop-color="#0a1a2c"/><stop offset="1" stop-color="#050b15"/></radialGradient>
    <radialGradient id="face" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#16314d"/><stop offset="1" stop-color="#081422"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe6ff"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#ff2f45"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset="1" stop-color="#ff9a00"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- vành đồng hồ -->
  <circle cx="256" cy="268" r="206" fill="#04090f" opacity=".6" filter="url(#glow)"/>
  <circle cx="256" cy="262" r="200" fill="url(#face)" stroke="#2a4d6e" stroke-width="6"/>
  <circle cx="256" cy="262" r="186" fill="none" stroke="#3fe6ff" stroke-width="3" opacity=".35"/>
  <!-- cung tốc độ 225° → -45° (r 160) -->
  <path d="M142.9 375.1 A160 160 0 1 1 369.1 375.1" fill="none" stroke="#1d3550" stroke-width="26" stroke-linecap="round"/>
  <path d="M142.9 375.1 A160 160 0 1 1 369.1 375.1" fill="none" stroke="url(#arc)" stroke-width="26" stroke-linecap="round" filter="url(#g2)" opacity=".8"/>
  <path d="M142.9 375.1 A160 160 0 1 1 369.1 375.1" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"/>
  <!-- vạch chia -->
  <g stroke="#dff8ff" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M170.4 347.6 L184.5 333.5"/><path d="M136.7 289.3 L156.2 284.6"/><path d="M136.7 234.7 L156.2 239.4" transform="rotate(0)"/>
    <path d="M170.4 176.4 L184.5 190.5"/><path d="M226.2 142.6 L231 162"/><path d="M285.8 142.6 L281 162"/><path d="M341.6 176.4 L327.5 190.5"/><path d="M375.3 234.7 L355.8 239.4"/><path d="M375.3 289.3 L355.8 284.6"/><path d="M341.6 347.6 L327.5 333.5"/>
  </g>
  <!-- tia sét giữa -->
  <path d="M270 304 L236 358 L258 358 L244 404 L292 344 L268 344 L284 304 Z" fill="#ff9a00" filter="url(#g2)" opacity=".7"/>
  <path d="M270 304 L236 358 L258 358 L244 404 L292 344 L268 344 L284 304 Z" fill="url(#bolt)"/>
  <!-- kim -->
  <g transform="rotate(38 256 262)">
    <path d="M244 262 L256 112 L268 262 Z" fill="#ff2f45" filter="url(#g2)"/>
    <path d="M246 266 L256 116 L266 266 Z" fill="#ff4a5c"/>
    <path d="M256 262 L256 120 L262 262 Z" fill="#ffb3bc" opacity=".6"/>
  </g>
  <circle cx="256" cy="262" r="32" fill="#0b1626" stroke="#3fe6ff" stroke-width="5"/>
  <circle cx="256" cy="262" r="22" fill="#da251d"/>
  <path d="M256 248 l4 12.4 13 0 -10.5 7.6 4 12.4 -10.5-7.6 -10.5 7.6 4-12.4 -10.5-7.6 13 0z" fill="#ffd400"/>
  <!-- vệt tốc độ dưới -->
    <path d="M60 60 Q256 0 452 60 Q256 120 60 60 Z" fill="#fff" opacity=".04"/>
</svg>
