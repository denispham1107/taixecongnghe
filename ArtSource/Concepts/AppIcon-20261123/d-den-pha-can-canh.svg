<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 21.343 mẫu D «Đèn pha cận cảnh»: đầu xe vàng phủ kín icon, đôi đèn pha neon, kính phản chiếu phố đêm, huy hiệu sao đỏ — dễ nhận ra ở cỡ nhỏ -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#1b1840"/></linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14a"/><stop offset=".35" stop-color="#ffcc1a"/><stop offset="1" stop-color="#e09600"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset="1" stop-color="#ffd02a" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2a6e"/><stop offset=".6" stop-color="#7a3a8c"/><stop offset="1" stop-color="#ff8a5a"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#e6fdff" stop-opacity="1"/><stop offset=".3" stop-color="#57ecff" stop-opacity=".55"/><stop offset="1" stop-color="#57ecff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="mesh" width="18" height="12" patternUnits="userSpaceOnUse">
      <rect width="18" height="12" fill="#0c0c12"/><path d="M0 6 L4.5 0 L13.5 0 L18 6 L13.5 12 L4.5 12 Z" fill="#1e1f2a"/><path d="M3 6 L6 2 L12 2 L15 6 L12 10 L6 10 Z" fill="#0c0c12"/>
    </pattern>
    <clipPath id="ws"><path d="M128 150 L176 36 Q182 22 198 22 L314 22 Q330 22 336 36 L384 150 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#night)"/>
  <!-- thân xe tràn khung -->
  <path d="M-30 210 Q40 156 112 148 L400 148 Q472 156 542 210 L542 540 L-30 540 Z" fill="url(#yel)"/>
  <!-- kính lái + khung -->
  <path d="M112 152 L164 26 Q172 8 192 8 L320 8 Q340 8 348 26 L400 152 Z" fill="#ffcf22"/>
  <path d="M128 150 L176 36 Q182 22 198 22 L314 22 Q330 22 336 36 L384 150 Z" fill="url(#glass)"/>
  <g clip-path="url(#ws)">
    <g fill="#1d1640" opacity=".9">
      <rect x="150" y="104" width="22" height="50"/><rect x="174" y="88" width="18" height="66"/><rect x="194" y="112" width="26" height="42"/>
      <path d="M232 154 L234 70 Q242 44 250 70 L252 154 Z"/><ellipse cx="256" cy="84" rx="11" ry="3"/>
      <rect x="270" y="100" width="20" height="54"/><rect x="292" y="84" width="22" height="70"/><rect x="316" y="110" width="30" height="44"/>
    </g>
    <path d="M150 22 L230 22 L150 160 L100 160 Z" fill="#fff" opacity=".14"/>
    <path d="M250 22 L272 22 L190 160 L176 160 Z" fill="#fff" opacity=".1"/>
  </g>
  <path d="M196 13 L316 13" stroke="#fff6b8" stroke-width="4" stroke-linecap="round"/>
  <!-- gương -->
  <path d="M84 158 Q70 136 92 128 L130 132 L120 160 Z" fill="#ffcf22"/>
  <path d="M428 158 Q442 136 420 128 L382 132 L392 160 Z" fill="#ffcf22"/>
  <!-- nắp capo -->
  <path d="M112 150 L400 150 L384 166 L128 166 Z" fill="url(#hood)" opacity=".9"/>
  <path d="M176 166 L234 300 M336 166 L278 300" stroke="#c88400" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <path d="M184 166 L238 290 L274 290 L328 166 Z" fill="#fff4a8" opacity=".22"/>
  <!-- đèn pha -->
  <ellipse cx="96" cy="284" rx="92" ry="54" fill="url(#halo)"/><ellipse cx="416" cy="284" rx="92" ry="54" fill="url(#halo)"/>
  <path d="M10 246 L186 286 L166 314 L4 290 Z" fill="#141018"/>
  <path d="M20 254 L178 288 L162 306 L14 284 Z" fill="#57ecff" filter="url(#glow)"/>
  <path d="M20 254 L178 288 L162 306 L14 284 Z" fill="#f2feff"/>
  <path d="M40 268 L120 284 M120 284 L104 300" stroke="#57ecff" stroke-width="5" stroke-linecap="round"/>
  <path d="M502 246 L326 286 L346 314 L508 290 Z" fill="#141018"/>
  <path d="M492 254 L334 288 L350 306 L498 284 Z" fill="#57ecff" filter="url(#glow)"/>
  <path d="M492 254 L334 288 L350 306 L498 284 Z" fill="#f2feff"/>
  <path d="M472 268 L392 284 M392 284 L408 300" stroke="#57ecff" stroke-width="5" stroke-linecap="round"/>
  <!-- huy hiệu -->
  <circle cx="256" cy="318" r="27" fill="#a3140f"/>
  <circle cx="256" cy="316" r="24" fill="#da251d" stroke="#ffe14d" stroke-width="4"/>
  <path d="M256 299 l4.8 13.2 14 0 -11.2 8.4 4.2 13.4 -11.8-8.2 -11.8 8.2 4.2-13.4 -11.2-8.4 14 0z" fill="#ffd400"/>
  <!-- cản dưới -->
  <path d="M-30 360 Q256 336 542 360 L542 540 L-30 540 Z" fill="#101016"/>
  <path d="M170 372 L342 372 L320 470 L192 470 Z" fill="url(#mesh)"/>
  <path d="M170 372 L342 372 L320 470 L192 470 Z" fill="none" stroke="#ffcf22" stroke-width="6" stroke-linejoin="round"/>
  <path d="M-10 380 L130 372 L150 470 L-10 470 Z" fill="url(#mesh)"/>
  <path d="M522 380 L382 372 L362 470 L522 470 Z" fill="url(#mesh)"/>
  <path d="M130 372 L150 470 M382 372 L362 470" stroke="#ffcf22" stroke-width="8" stroke-linecap="round"/>
  <path d="M-30 478 Q256 462 542 478 L542 540 L-30 540 Z" fill="#1c1c24"/>
  <path d="M60 494 L452 494" stroke="#ffcf22" stroke-width="5" stroke-linecap="round" opacity=".7"/>
</svg>
