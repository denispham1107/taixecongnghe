<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 21.344 mẫu 4 «Biển báo khủng long»: biển cảnh báo tam giác kiểu Việt Nam (nền vàng viền đỏ) với bóng khủng long — hiểm họa vui nhộn của game -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1f8a86"/><stop offset=".6" stop-color="#0f5559"/><stop offset="1" stop-color="#07282f"/></radialGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe45a"/><stop offset="1" stop-color="#ffc400"/></linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4b0"/><stop offset=".5" stop-color="#e3e8ee"/><stop offset="1" stop-color="#7b8592"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#fff" stroke-width="3" opacity=".08"><path d="M0 120 L512 40"/><path d="M0 220 L512 140"/><path d="M0 320 L512 240"/><path d="M0 420 L512 340"/></g>
  <!-- cột -->
  <rect x="242" y="420" width="28" height="100" fill="url(#pole)"/>
  <!-- biển -->
  <polygon points="256,84 462,436 50,436" fill="#022" opacity=".5" stroke="#022" stroke-width="64" stroke-linejoin="round" filter="url(#shadow)" transform="translate(6,12)"/>
  <polygon points="256,84 462,436 50,436" fill="#fff" stroke="#fff" stroke-width="64" stroke-linejoin="round"/>
  <polygon points="256,84 462,436 50,436" fill="#e3262b" stroke="#e3262b" stroke-width="44" stroke-linejoin="round"/>
  <polygon points="256,150 404,404 108,404" fill="url(#sign)" stroke="url(#sign)" stroke-width="22" stroke-linejoin="round"/>
  <!-- khủng long -->
  <g transform="translate(-14,10)" fill="#141414">
    <path d="M236 248 Q244 226 268 222 L306 224 Q322 226 324 238 L322 246 L292 248 L316 254 Q314 262 300 262 L282 262 Q276 274 282 286 L298 290 L300 298 L288 296 Q290 312 280 324 L290 360 L304 388 L322 392 L322 398 L282 398 L270 364 L262 340 L256 362 L262 392 L276 398 L236 398 L232 366 Q226 344 214 336 Q180 352 128 386 Q174 334 206 306 Q222 280 236 248 Z"/>
    <circle cx="296" cy="232" r="4" fill="#ffd21f"/>
    <path d="M296 248 l4 5 4-5 4 5 4-5" fill="none" stroke="#ffd21f" stroke-width="2"/>
  </g>
</svg>
