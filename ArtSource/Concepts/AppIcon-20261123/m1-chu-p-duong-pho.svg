<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 21.344 mẫu 1 «Chữ P đường phố»: chữ P (Phố) là một con đường nhựa có vạch vàng, ngôi sao vàng nằm trong lòng chữ, nền đỏ -->
  <defs>
    <radialGradient id="bg" cx=".42" cy=".3" r=".85">
      <stop offset="0" stop-color="#ff4a3d"/><stop offset=".55" stop-color="#d81e26"/><stop offset="1" stop-color="#8f0f18"/>
    </radialGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a46"/><stop offset="1" stop-color="#1b1b22"/>
    </linearGradient>
    <radialGradient id="star" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff6a8"/><stop offset=".6" stop-color="#ffd21f"/><stop offset="1" stop-color="#ffb000"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity=".08" fill="#fff"><path d="M-40 512 L200 0 L260 0 L20 512 Z"/><path d="M80 512 L320 0 L350 0 L110 512 Z"/></g>

  <!-- bóng chữ -->
  <path d="M150 540 L150 104 L258 104 A106 106 0 0 1 258 316 L150 316" fill="none" stroke="#5a0007" stroke-width="96" stroke-linejoin="round" opacity=".55" filter="url(#shadow)" transform="translate(8,12)"/>
  <!-- con đường chữ P -->
  <path d="M150 540 L150 104 L258 104 A106 106 0 0 1 258 316 L150 316" fill="none" stroke="#fff4e6" stroke-width="96" stroke-linejoin="round"/>
  <path d="M150 540 L150 104 L258 104 A106 106 0 0 1 258 316 L150 316" fill="none" stroke="url(#asphalt)" stroke-width="80" stroke-linejoin="round"/>
  <path d="M150 540 L150 104 L258 104 A106 106 0 0 1 258 316 L150 316" fill="none" stroke="#ffd21f" stroke-width="7" stroke-dasharray="24 18" stroke-linejoin="round"/>
  <!-- vạch đi bộ ở chân chữ -->
  <g fill="#fff4e6" opacity=".9"><rect x="116" y="452" width="68" height="9" rx="2"/><rect x="116" y="472" width="68" height="9" rx="2"/><rect x="116" y="492" width="68" height="9" rx="2"/></g>

  <!-- ngôi sao trong lòng chữ -->
  <path d="M262 160 l13.5 41.5 43.6 0 -35.3 25.6 13.5 41.5 -35.3-25.6 -35.3 25.6 13.5-41.5 -35.3-25.6 43.6 0z" fill="#ffd21f" filter="url(#glow)" opacity=".7"/>
  <path d="M262 160 l13.5 41.5 43.6 0 -35.3 25.6 13.5 41.5 -35.3-25.6 -35.3 25.6 13.5-41.5 -35.3-25.6 43.6 0z" fill="url(#star)"/>
  <path d="M262 160 l13.5 41.5 -13.5 9.8 z" fill="#fff" opacity=".35"/>
  <!-- sheen -->
  <path d="M0 0 H512 V150 Q256 210 0 140 Z" fill="#fff" opacity=".07"/>
</svg>
