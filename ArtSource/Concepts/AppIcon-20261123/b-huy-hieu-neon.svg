<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 21.343 mẫu B «Huy hiệu neon»: cùng phong cách «Kính neon» của 9 nút điều khiển; đầu xe vàng nhìn thẳng, tia sét hổ phách phía sau, huy hiệu sao đỏ trên mũi xe -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#123049"/><stop offset=".6" stop-color="#0a1828"/><stop offset="1" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a57"/><stop offset=".55" stop-color="#0d2238"/><stop offset="1" stop-color="#081626"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a0"/><stop offset=".5" stop-color="#ffc21f"/><stop offset="1" stop-color="#ff8400"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffec6e"/><stop offset=".45" stop-color="#ffc814"/><stop offset="1" stop-color="#d98f00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20456b"/><stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#c8fbff" stop-opacity=".95"/><stop offset=".35" stop-color="#3fe6ff" stop-opacity=".5"/><stop offset="1" stop-color="#3fe6ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="pc"><rect x="52" y="52" width="408" height="408" rx="104"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- tấm kính -->
  <rect x="52" y="52" width="408" height="408" rx="104" fill="url(#plate)"/>
  <g clip-path="url(#pc)">
    <!-- lưới đường phối cảnh -->
    <g stroke="#3fe6ff" stroke-width="2" opacity=".28">
      <path d="M256 300 L40 470"/><path d="M256 300 L140 470"/><path d="M256 300 L372 470"/><path d="M256 300 L472 470"/>
      <path d="M60 438 L452 438"/><path d="M120 400 L392 400"/>
    </g>
    <!-- tia sét -->
    <path d="M300 62 L194 180 L248 180 L210 262 L326 146 L272 146 L334 62 Z" fill="#ff9b1f" filter="url(#glow)" opacity=".9"/>
    <path d="M300 62 L194 180 L248 180 L210 262 L326 146 L272 146 L334 62 Z" fill="url(#bolt)"/>
    <path d="M306 70 L210 174 L222 174 L316 70 Z" fill="#fffbe0" opacity=".7"/>
    <!-- XE VÀNG (đầu) -->
    <ellipse cx="256" cy="408" rx="150" ry="14" fill="#000" opacity=".55"/>
    <rect x="134" y="360" width="46" height="54" rx="9" fill="#090a10" stroke="#2c3442" stroke-width="2"/>
    <rect x="332" y="360" width="46" height="54" rx="9" fill="#090a10" stroke="#2c3442" stroke-width="2"/>
    <path d="M160 302 L190 262 Q196 254 208 254 L304 254 Q316 254 322 262 L352 302 Z" fill="#ffcf22"/>
    <path d="M176 300 L200 268 Q204 263 212 263 L300 263 Q308 263 312 268 L336 300 Z" fill="url(#glass)"/>
    <path d="M214 265 L246 265 L206 300 L184 300 Z" fill="#7fefff" opacity=".22"/>
    <path d="M212 256.5 L300 256.5" stroke="#fff6b8" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="156" cy="298" rx="17" ry="8" fill="#ffcf22"/><ellipse cx="356" cy="298" rx="17" ry="8" fill="#ffcf22"/>
    <path d="M118 334 Q116 310 140 298 L372 298 Q396 310 394 334 L390 382 Q389 392 378 392 L134 392 Q123 392 122 382 Z" fill="url(#yel)"/>
    <path d="M140 298 L372 298 L364 306 L148 306 Z" fill="#fff6a8" opacity=".85"/>
    <path d="M206 304 L238 344 M306 304 L274 344" stroke="#c98500" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <!-- đèn pha -->
    <circle cx="176" cy="326" r="44" fill="url(#halo)"/><circle cx="336" cy="326" r="44" fill="url(#halo)"/>
    <path d="M130 314 L208 326 L200 338 L136 330 Z" fill="#3fe6ff" filter="url(#g2)"/>
    <path d="M130 314 L208 326 L200 338 L136 330 Z" fill="#effdff"/>
    <path d="M382 314 L304 326 L312 338 L376 330 Z" fill="#3fe6ff" filter="url(#g2)"/>
    <path d="M382 314 L304 326 L312 338 L376 330 Z" fill="#effdff"/>
    <!-- hốc gió -->
    <path d="M204 350 L308 350 L298 386 L214 386 Z" fill="#101118"/>
    <g stroke="#262833" stroke-width="3"><path d="M212 364 L300 364"/><path d="M214 377 L298 377"/></g>
    <path d="M132 346 L186 352 L178 384 L136 384 Z" fill="#101118"/>
    <path d="M380 346 L326 352 L334 384 L376 384 Z" fill="#101118"/>
    <!-- huy hiệu sao -->
    <circle cx="256" cy="326" r="13" fill="#da251d" stroke="#ffe14d" stroke-width="2.5"/>
    <path d="M256 317.5 l2.4 6.6 7 0 -5.6 4.2 2.1 6.7 -5.9-4.1 -5.9 4.1 2.1-6.7 -5.6-4.2 7 0z" fill="#ffd400"/>
    <!-- bóng kính -->
    <path d="M52 52 H460 V220 Q256 170 52 236 Z" fill="url(#sheen)"/>
  </g>
  <!-- viền neon -->
  <rect x="52" y="52" width="408" height="408" rx="104" fill="none" stroke="#3fe6ff" stroke-width="14" opacity=".55" filter="url(#glow)"/>
  <rect x="52" y="52" width="408" height="408" rx="104" fill="none" stroke="#56ecff" stroke-width="8"/>
  <rect x="58" y="58" width="396" height="396" rx="98" fill="none" stroke="#d8fbff" stroke-width="2" opacity=".6"/>
</svg>
